# Builds the browser version with pygbag and publishes it to the gh-pages
# branch, which GitHub Pages serves at https://<user>.github.io/<repo>/.
# (Settings -> Pages -> Build and deployment: "Deploy from a branch",
# branch gh-pages, folder / root.)
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with pygbag
        run: |
          python -m pip install pygbag==0.9.3
          python -m pygbag --build --no_opt --title "Pyraria" --width 1280 --height 720 --icon favicon.png .

      - name: Publish to gh-pages
        run: |
          cd build/web
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Web build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
